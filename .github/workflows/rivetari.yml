name: rivetari
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

# Least privilege by default; each job widens only what it needs.
permissions:
  contents: read

# One run per ref so a newer push/PR update supersedes an in-flight run and the two
# can't race on the sticky comment or the status issue.
concurrency:
  group: rivetari-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR runs post a sticky review comment — pull-requests:write only.
  audit-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      # Pinned to a commit SHA for supply-chain safety (Rivetari main, #184).
      - uses: arynbht/rivetari/packages/action@328afac44576dde7732472ba51ce7b5ad6b8eb65
        with:
          gate: build
          token: ${{ secrets.GITHUB_TOKEN }}

  # Scheduled / push / manual runs maintain the pinned status issue — issues:write only.
  audit-status:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: arynbht/rivetari/packages/action@328afac44576dde7732472ba51ce7b5ad6b8eb65
        with:
          gate: build
          token: ${{ secrets.GITHUB_TOKEN }}
