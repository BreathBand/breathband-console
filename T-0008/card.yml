id: T-0008
title: Add a documented http backend adapter stub for a future Cloud Run API
type: feature
source: prompt
description: "Decision 2 (2026-11-23): BreathCloud runs on the local adapter for
  now, and the backend seam gets an http adapter stub with the same interface
  for a future Cloud Run API. Today src/lib/backend/index.ts:12-17 chooses only
  between local and firebase, src/lib/backend/types.ts:197 types kind as 'local'
  | 'firebase', and src/lib/backend/firebase/index.ts:29-34 is the pattern to
  follow: a documented stub whose factory throws with a pointer to its file."
acceptance:
  - id: A1
    text: src/lib/backend/http/index.ts exports createHttpBackend(), which throws an
      Error naming NEXT_PUBLIC_BACKEND=http and pointing to
      src/lib/backend/http/index.ts, as the firebase stub does
    verify: unit
  - id: A2
    text: The stub's header comment maps every AuthService and DataService method in
      src/lib/backend/types.ts to a proposed REST call (method and path) on a
      future Cloud Run API, states that auth is an open decision, and makes no
      network calls
    verify: review
  - id: A3
    text: Backend['kind'] includes 'http'; backendKind() returns 'http' when
      NEXT_PUBLIC_BACKEND=http, still returns 'firebase' for firebase, and
      returns 'local' for anything else; createBackend('http') throws the stub's
      error. All of this is shown in a new test file
      src/lib/backend/http/http.test.ts
    verify: unit
  - id: A4
    text: .env.example lists http as an allowed NEXT_PUBLIC_BACKEND value, plus a
      commented placeholder for the future API base URL
    verify: review
  - id: A5
    text: No new dependency, no change to src/lib/backend/local/** or
      src/lib/backend/local/local.test.ts; npm run lint, typecheck, test and
      build pass
    verify: unit
out_of_scope:
  - Implementing any HTTP call or server
  - Firebase adapter or firebase/ rules changes
touches:
  - src/lib/backend/http/**
  - src/lib/backend/index.ts
  - src/lib/backend/types.ts
  - .env.example
pages: []
constraints:
  - no new dependencies
risk: high
owner: arynbht@gmail.com
created: 2026-11-24
