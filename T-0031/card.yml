  - no new code comments (quality.no-new-comments)
  - do not modify existing tests; add new test files
  - import Appendix constants from src/lib/analysis/config.ts
  - config.ts may only gain new FIXED_CONSTANTS keys; existing keys and values
    stay
  - expected golden values are literal data, never computed at test time by the
    code under test
  - static export only; pure TypeScript with no browser or Node APIs
  - "depends on B1-1 and B1-2, both merged; method C (B1-3) is merged too and
    shows the band-edge pattern to follow: floorAtEdge and
    FIXED_CONSTANTS.bandEdgeEpsilon in src/lib/analysis/paced.ts"
