id: T-0032
title: Open-session metrics with per-segment split and golden vectors
type: feature
source: prompt
description: >-
  The Appendix defines ten open-session metrics, each also shown per segment
  (before, between and after up to 2 event markers). Today an open session
  carries one number: src/lib/domain/types.ts (respirationRateBpm, "null when
  fewer than 3 breaths"), which the seed makes up
  (src/lib/backend/local/seed.ts), and the open review shows only that rate (the
  parity map, row 9). src/lib/domain/waveform.ts returns no breaths for open
  sessions at all. The constants are in src/lib/analysis/config.ts:
  normalInhaleDurationS, normalExhaleDurationS, normalDepthBand {centre 6,
  tolerance 25%}, normalRateBpm 12-16, normalIeRatio and
  maxEventMarkersPerOpenSession 2.


  This card adds src/lib/analysis/open.ts. A breath runs trough → peak → trough.
  The metrics: avg rate = 60 / mean period; I:E = mean exhale / mean inhale, as
  the x in "1 : x"; inhale duration = peak − previous trough; exhale duration =
  trough − previous peak; avg depth = peak − next trough; inhale depth = peak
  above the midline; exhale depth = trough below the midline, as a positive
  number; depth index = (avg depth − 6) / 6 × 100, capped at ±100; % at normal
  rate = the share of breaths whose own rate is inside 12-16 bpm (inclusive); %
  at normal depth = the share of breaths whose depth is inside 6% ± 25%, that is
  4.5-7.5 (inclusive, a relative tolerance). Every metric is computed for the
  whole session and for each segment. A breath belongs to the segment that
  contains its peak. Only the first 2 markers by time are used; extra markers
  (legacy app data) are ignored and counted. The depth index uses avg depth
  only.


  Redraft of T-0031, which was abandoned when Rivetari left its finished work
  uncommitted (R-14). That work is saved at
  rivetari-session/logs/T-0031-uncommitted-R-14.patch and may be reused. T-0031
  found that B1-2's 1 Hz zero-phase low-pass moves the extrema of asymmetric
  breaths: detected peaks land about 0.1-0.16 s late and troughs about 0.05 s
  early, so the noise-free normal pattern (1.5 s in, 3.0 s out) reads I:E 1.81
  instead of 2.0. The Appendix says (l.15) "Low-pass the signal (~1 Hz,
  4th-order Butterworth, zero-phase)." and (l.16) "Find peaks and troughs with
  prominence ≥ 1% of max and spacing ≥ 0.5 s." It does not say whether a
  transition's time and level come from the filtered or the raw signal. Decision
  by rivetari-51, PROVISIONAL pending Harm, who owns the spec: detect on the
  filtered signal exactly as B1-2 does, then, in analyzeOpen only, move each
  detected transition to the raw signal's extremum of the same type within
  ±FIXED_CONSTANTS.transitionRefineWindowS (0.25 s). Paced scoring (B1-3) is not
  changed, so until Harm confirms, open and paced locate transitions
  differently.


  As in B1-3, Tier A feeds exact transition lists into the metrics (±0.05), plus
  one noise-free end-to-end check, and Tier B runs end to end with seeded noise.
acceptance:
  - id: A1
    text: src/lib/analysis/open.ts exports openMetrics(transitions, {durationS,
      markersS}) and analyzeOpen(pctSamples, sampleRateHz, markerIndices), which
      runs B1-2's detectTransitions first. Both return {whole, segments,
      markersUsed, markersIgnored}. Segments are [] with no marker, before/after
      with 1, and before/between/after with 2, each with fromS, toS, breath
      count and the full metric set. A segment with no complete breath has null
      metrics. New test src/lib/analysis/open.test.ts covers 0, 1, 2 and 3
      markers (the third is ignored and counted), a breath whose peak sits on
      either side of a marker, and an empty segment.
    verify: unit
  - id: A2
    text: "Tier A, metrics level. src/lib/analysis/golden/open-tier-a.ts holds exact
      transition lists and literal expected values (no comments, nothing
      computed by the code under test).
      src/lib/analysis/golden/open-golden.test.ts matches every metric within
      ±0.05: normal (inhale 1.5 s, exhale 3.0 s, ±3) gives rate 13.333, I:E 2.0,
      inhale 1.5 s, exhale 3.0 s, depth 6.0, inhale depth 3.0, exhale depth 3.0,
      depth index 0, normal rate 100%, normal depth 100%. Deep-fast (1.0 / 2.0
      s, ±4.5) gives rate 20.0, I:E 2.0, depth 9.0, depth index +50, normal rate
      0%, normal depth 0%. Shallow-slow (2.0 / 4.0 s, ±1.5) gives rate 10.0,
      depth 3.0, depth index -50, normal rate 0%, normal depth 0%. Asymmetric
      (1.5 / 3.0 s, peaks +4, troughs -2) gives depth 6.0, inhale depth 4.0,
      exhale depth 2.0, depth index 0. Too deep (1.5 / 3.0 s, ±7.5) gives depth
      15.0 and depth index +100 (capped from +150). Mixed periods 4.5, 4.5, 4.5,
      3.0 repeating give normal rate 75% and rate 60 / 4.125 ≈ 14.545."
    verify: unit
  - id: A3
    text: Tier A, segments. The exact list is normal from 0 to 54 s, deep-fast from
      54 to 90 s and normal from 90 to 180 s, with markers at 54 s and 90 s. It
      gives segments before / between / after with 12 / 12 / 20 breaths, whose
      metrics equal the normal / deep-fast / normal Tier A values within ±0.05.
      The whole session gives rate 14.667 (44 breaths in 180 s), I:E 2.0, depth
      300/44 ≈ 6.818, depth index ≈ 13.6, normal rate 32/44 ≈ 72.7% and normal
      depth 32/44 ≈ 72.7%. All of this is in the fixture as data.
    verify: unit
  - id: A4
    text: "End to end. The B1-1 normal open pattern (1.5 / 3.0 s, ±3, 180 s, 20 Hz,
      noise-free) through analyzeOpen matches the normal Tier A values within
      ±0.05. Tier B: src/lib/analysis/golden/open-tier-b.ts stores one noise
      setting and seed as data. With it, the normal pattern and the 2-marker
      segmented session from A3 (built with B1-1's piecewise form) land within
      ±0.3 of the Tier A values for rate (bpm), I:E, and the depths (% of max),
      and within ±0.1 s for durations. The % at normal rate and depth equal the
      Tier A values exactly (100 or 0 per segment)."
    verify: unit
  - id: A5
    text: open.ts reads every Appendix number from src/lib/analysis/config.ts
      (normal rate, the depth band and its tolerance, the marker cap, the
      reference depth for inhale and exhale depth). The ±100 depth-index cap is
      added to FIXED_CONSTANTS as a new key, with a new test asserting it.
      src/lib/analysis/index.ts re-exports open.ts. npm run lint, typecheck and
      test pass.
    verify: review
  - id: A6
    text: "Range checks and the cap are exact at their edges. The inclusive bounds
      for % at normal rate (12-16 bpm) and % at normal depth (4.5-7.5 % of max),
      and the ±100 depth-index cap, are compared using
      FIXED_CONSTANTS.bandEdgeEpsilon (already on main, 1e-9), never a bare
      float comparison. A new test src/lib/analysis/open-edges.test.ts forms
      breaths from transition times and levels and checks that periods of
      exactly 5.0 s (12 bpm) and 3.75 s (16 bpm) and depths of exactly 4.5 %
      (±2.25) and 7.5 % (±3.75) count as normal, while 5.05 s, 3.70 s, 4.45 %
      and 7.55 % do not. The edge periods also include ones formed from
      non-representable times: troughs at 3.3 s and 8.3 s (period
      5.000000000000001, rate 11.999999999999998) and troughs at 0.6 s and 4.35
      s (period 3.7499999999999996, rate 16.000000000000004) both count as
      normal rate. It also checks that a depth index of exactly ±100 stays ±100
      and one beyond it is capped."
    verify: unit
  - id: A7
    text: analyzeOpen refines each transition from detectTransitions to the raw
      (unfiltered) sample extremum of the same type within
      ±FIXED_CONSTANTS.transitionRefineWindowS of the detected time. The window
      is a new FIXED_CONSTANTS key, transitionRefineWindowS = 0.25, asserted by
      a new test. openMetrics (fed exact lists) and detectTransitions in
      transitions.ts are unchanged. A new test
      src/lib/analysis/open-refine.test.ts shows that the noise-free normal
      pattern (1.5 s in, 3.0 s out, ±3, 20 Hz) gives I:E 2.0 ± 0.05 through
      analyzeOpen, and that the same detected transitions without refinement
      give I:E below 1.9 (the bias being removed).
    verify: unit
  - id: A8
    text: docs/PLAN.md "Decisions" gains one entry, dated 2026-11-24 and marked
      PROVISIONAL, pending Harm. It quotes Appendix l.15 and l.16, states both
      readings (extrema located on the filtered signal, or detected on the
      filtered signal and located on the raw signal within 0.25 s), gives the
      measured effect (noise-free normal I:E 1.81 filtered vs 2.0 refined), says
      the refined reading is used for open metrics for now, and says paced
      scoring still uses filtered locations until Harm confirms, so the two
      differ until then. No other docs/PLAN.md text changes.
    verify: review
out_of_scope:
  - Signal generation (B1-1); filtering, calibration and transition detection
    (B1-2), including any change to detectTransitions, transitions.ts, filter.ts
    or calibration.ts
  - Method-C paced scoring (B1-3), including how paced scoring locates
    transitions (a separate follow-up card, held until Harm confirms)
  - Storing open metrics on SessionSummary, and the 2-marker cap on write
    (B1-5); in v1 the metrics are computed on read
  - Open-session metrics around lost or artifact spans (lost-then-recovered); no
    Appendix rule says how a breath spanning a lost span counts
  - Formatting the I:E as 1 to x, the red-inhale / blue-exhale graph, zoom, the
    per-segment table and any review screen (Batch 2)
  - The normal inhale and exhale duration ranges are only for display (Batch 2);
    no metric here uses them
